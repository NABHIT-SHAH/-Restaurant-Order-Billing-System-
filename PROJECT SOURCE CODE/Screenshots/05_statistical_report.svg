  <text x="30" y="76" fill="#38bdf8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500">▶ Real-time aggregation of total orders, revenue, tax collected, discounts given, and top 3 popular items.</text>

