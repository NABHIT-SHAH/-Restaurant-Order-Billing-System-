    <text x="25" y="324" fill="#60a5fa" font-weight="bold">  RESTAURANT ORDER &amp; BILLING SYSTEM</text>
    <text x="25" y="342" fill="#e2e8f0" font-weight="normal">  Enrollment: IU2541230417 | CPP07</text>
    <text x="25" y="360" fill="#60a5fa" font-weight="bold">========================================</text>
    <text x="25" y="378" fill="#93c5fd" font-weight="normal">1. Add Record</text>
    <text x="25" y="396" fill="#93c5fd" font-weight="normal">2. Display Records</text>
    <text x="25" y="414" fill="#93c5fd" font-weight="normal">3. Search Record</text>
    <text x="25" y="432" fill="#e2e8f0" font-weight="normal">4. Update Record</text>
