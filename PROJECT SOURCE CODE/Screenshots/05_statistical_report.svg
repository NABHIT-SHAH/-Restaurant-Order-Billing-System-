<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="876" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono', Menlo, Monaco, 'Courier New', monospace" font-size="12">
  <defs>
    <filter id="winShadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Terminal Window Frame -->
  <rect x="10" y="10" width="940" height="856" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#winShadow)"/>

  <!-- Titlebar -->
  <rect x="10" y="10" width="940" height="42" rx="10" fill="#1e293b"/>
  <rect x="10" y="40" width="940" height="12" fill="#1e293b"/>
  <line x1="10" y1="52" x2="950" y2="52" stroke="#334155" stroke-width="1"/>

  <!-- Traffic lights -->
  <circle cx="32" cy="31" r="6" fill="#ef4444"/>
  <circle cx="52" cy="31" r="6" fill="#f59e0b"/>
  <circle cx="72" cy="31" r="6" fill="#10b981"/>

  <!-- Window Title -->
  <text x="480" y="36" fill="#94a3b8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">terminal — Management &amp; Statistical Sales Report</text>

  <!-- Subtitle Bar -->
