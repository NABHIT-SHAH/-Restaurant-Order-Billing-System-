<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="980" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="cShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <marker id="inheritArrow" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <polygon points="0,0 14,7 0,14" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    </marker>
    <marker id="assocArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="diamond" viewBox="0 0 16 16" refX="0" refY="8" markerWidth="12" markerHeight="12" orient="auto">
      <polygon points="0,8 8,2 16,8 8,14" fill="#1e293b" stroke="#1e293b" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1280" height="980" fill="#f8fafc" rx="12"/>

  <!-- Title Banner -->
  <rect x="25" y="20" width="1230" height="60" rx="8" fill="#1e293b" filter="url(#cShadow)"/>
  <text x="640" y="47" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">CLASS DIAGRAM — RESTAURANT ORDER &amp; BILLING SYSTEM</text>
  <text x="640" y="67" font-size="12" fill="#94a3b8" text-anchor="middle">8 Classes | Inheritance &amp; Polymorphism | Dynamic Memory | Persistence</text>

  <!-- ==================== BASE CLASS: MenuItem ==================== -->
  <g transform="translate(50, 110)" filter="url(#cShadow)">
    <rect width="360" height="260" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect width="360" height="35" rx="6" fill="#2563eb"/>
    <text x="180" y="23" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">&lt;&lt;Abstract Base&gt;&gt; MenuItem</text>
    <!-- Attributes -->
    <text x="15" y="55" font-size="11" fill="#334155"># itemId : int</text>
    <text x="15" y="72" font-size="11" fill="#334155"># name : string</text>
    <text x="15" y="89" font-size="11" fill="#334155"># price : double</text>
    <text x="15" y="106" font-size="11" fill="#334155"># category : string</text>
    <text x="15" y="123" font-size="11" fill="#334155"># available : bool</text>
    <line x1="0" y1="133" x2="360" y2="133" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- Methods -->
    <text x="15" y="152" font-size="11" fill="#334155">+ MenuItem()</text>
    <text x="15" y="169" font-size="11" fill="#334155">+ MenuItem(id, name, price, cat)</text>
    <text x="15" y="186" font-size="11" fill="#334155">+ virtual ~MenuItem()</text>
    <text x="15" y="203" font-size="11" font-weight="bold" fill="#2563eb">+ virtual display() const : void</text>
    <text x="15" y="220" font-size="11" font-weight="bold" fill="#2563eb">+ virtual getType() const : string</text>
    <text x="15" y="237" font-size="11" fill="#334155">+ virtual toFileString() const : string</text>
    <text x="15" y="254" font-size="11" fill="#334155">+ virtual fromFileString(line) : void</text>
  </g>

  <!-- ==================== DERIVED: FoodItem ==================== -->
  <g transform="translate(30, 420)" filter="url(#cShadow)">
    <rect width="210" height="180" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <rect width="210" height="32" rx="6" fill="#16a34a"/>
    <text x="105" y="22" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">FoodItem</text>
    <!-- Attributes -->
    <text x="12" y="52" font-size="11" fill="#334155">- cuisineType : string</text>
    <text x="12" y="69" font-size="11" fill="#334155">- isVeg : bool</text>
    <line x1="0" y1="78" x2="210" y2="78" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- Methods -->
    <text x="12" y="97" font-size="11" fill="#334155">+ FoodItem()</text>
    <text x="12" y="114" font-size="11" fill="#334155">+ FoodItem(..., cuisine, veg)</text>
    <text x="12" y="131" font-size="11" fill="#334155">+ display() override</text>
    <text x="12" y="148" font-size="11" fill="#334155">+ getType() override</text>
    <text x="12" y="165" font-size="11" fill="#334155">+ toFileString() override</text>
  </g>

  <!-- ==================== DERIVED: BeverageItem ==================== -->
  <g transform="translate(260, 420)" filter="url(#cShadow)">
    <rect width="210" height="180" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <rect width="210" height="32" rx="6" fill="#16a34a"/>
    <text x="105" y="22" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">BeverageItem</text>
    <!-- Attributes -->
    <text x="12" y="52" font-size="11" fill="#334155">- size : string</text>
    <text x="12" y="69" font-size="11" fill="#334155">- isHot : bool</text>
    <line x1="0" y1="78" x2="210" y2="78" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- Methods -->
    <text x="12" y="97" font-size="11" fill="#334155">+ BeverageItem()</text>
    <text x="12" y="114" font-size="11" fill="#334155">+ BeverageItem(..., size, hot)</text>
    <text x="12" y="131" font-size="11" fill="#334155">+ display() override</text>
    <text x="12" y="148" font-size="11" fill="#334155">+ getType() override</text>
    <text x="12" y="165" font-size="11" fill="#334155">+ toFileString() override</text>
  </g>

  <!-- Inheritance lines -->
  <line x1="135" y1="420" x2="180" y2="375" stroke="#1e293b" stroke-width="2" marker-end="url(#inheritArrow)"/>
  <line x1="340" y1="420" x2="260" y2="375" stroke="#1e293b" stroke-width="2" marker-end="url(#inheritArrow)"/>

  <!-- ==================== Customer Class ==================== -->
  <g transform="translate(50, 640)" filter="url(#cShadow)">
    <rect width="320" height="240" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <rect width="320" height="35" rx="6" fill="#d97706"/>
    <text x="160" y="23" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Customer</text>
    <!-- Attributes -->
    <text x="15" y="55" font-size="11" fill="#334155">- customerId : int</text>
    <text x="15" y="72" font-size="11" fill="#334155">- name : string</text>
    <text x="15" y="89" font-size="11" fill="#334155">- phone : string (10-digit)</text>
    <text x="15" y="106" font-size="11" fill="#334155">- address : string</text>
    <line x1="0" y1="116" x2="320" y2="116" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- Methods -->
    <text x="15" y="135" font-size="11" fill="#334155">+ Customer()</text>
    <text x="15" y="152" font-size="11" fill="#334155">+ Customer(id, name, phone, addr)</text>
    <text x="15" y="169" font-size="11" fill="#334155">+ ~Customer()</text>
    <text x="15" y="186" font-size="11" fill="#334155">+ getCustomerId() : int</text>
    <text x="15" y="203" font-size="11" fill="#334155">+ display() : void</text>
    <text x="15" y="220" font-size="11" fill="#334155">+ toFileString() : string</text>
    <text x="15" y="235" font-size="11" fill="#334155">+ fromFileString(line) : void</text>
  </g>

  <!-- ==================== Order Class (Dynamic Memory) ==================== -->
  <g transform="translate(450, 110)" filter="url(#cShadow)">
    <rect width="340" height="310" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <rect width="340" height="35" rx="6" fill="#7c3aed"/>
    <text x="170" y="23" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Order [Dynamic Memory]</text>
    <!-- Attributes -->
    <text x="15" y="55" font-size="11" fill="#334155">- orderId : int</text>
    <text x="15" y="72" font-size="11" fill="#334155">- customerId : int</text>
    <text x="15" y="89" font-size="11" font-weight="bold" fill="#7c3aed">- itemIds : int* (new int[cap])</text>
    <text x="15" y="106" font-size="11" font-weight="bold" fill="#7c3aed">- quantities : int* (new int[cap])</text>
    <text x="15" y="123" font-size="11" fill="#334155">- itemCount : int</text>
    <text x="15" y="140" font-size="11" fill="#334155">- capacity : int</text>
    <text x="15" y="157" font-size="11" fill="#334155">- status : string</text>
    <text x="15" y="174" font-size="11" fill="#334155">- orderDate : string</text>
    <line x1="0" y1="184" x2="340" y2="184" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- Methods -->
    <text x="15" y="202" font-size="11" fill="#334155">+ Order() / Order(id, custId)</text>
    <text x="15" y="219" font-size="11" font-weight="bold" fill="#7c3aed">+ Order(const Order&amp;) [Deep Copy]</text>
    <text x="15" y="236" font-size="11" font-weight="bold" fill="#7c3aed">+ operator=(const Order&amp;) [Rule of 3]</text>
    <text x="15" y="253" font-size="11" font-weight="bold" fill="#7c3aed">+ ~Order() [delete[] arrays]</text>
    <text x="15" y="270" font-size="11" fill="#334155">+ addItem(id, qty) : void [auto resize]</text>
    <text x="15" y="287" font-size="11" fill="#334155">+ display() / toFileString() / fromFile()</text>
  </g>

  <!-- ==================== Bill Class ==================== -->
  <g transform="translate(450, 460)" filter="url(#cShadow)">
    <rect width="340" height="250" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect width="340" height="35" rx="6" fill="#0284c7"/>
    <text x="170" y="23" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Bill</text>
    <!-- Attributes -->
    <text x="15" y="55" font-size="11" fill="#334155">- billId, orderId, customerId : int</text>
    <text x="15" y="72" font-size="11" fill="#334155">- subtotal, taxRate, taxAmount : double</text>
    <text x="15" y="89" font-size="11" fill="#334155">- discount, totalAmount : double</text>
    <text x="15" y="106" font-size="11" fill="#334155">- paymentStatus, paymentMethod : string</text>
    <text x="15" y="123" font-size="11" fill="#334155">- billDate : string</text>
    <line x1="0" y1="133" x2="340" y2="133" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- Methods -->
    <text x="15" y="152" font-size="11" fill="#334155">+ Bill() / Bill(id, oid, cid, sub, tax, disc)</text>
    <text x="15" y="169" font-size="11" fill="#334155">+ ~Bill()</text>
    <text x="15" y="186" font-size="11" font-weight="bold" fill="#0284c7">+ calculateTotal() : void</text>
    <text x="15" y="203" font-size="11" fill="#334155">+ display() : void [receipt layout]</text>
    <text x="15" y="220" font-size="11" fill="#334155">+ toFileString() / fromFileString()</text>
    <text x="15" y="237" font-size="11" fill="#334155">+ getters &amp; setters</text>
  </g>

  <!-- Association Order <-> Bill -->
  <line x1="620" y1="420" x2="620" y2="460" stroke="#475569" stroke-width="2" marker-end="url(#assocArrow)"/>
  <text x="630" y="445" font-size="10" fill="#64748b">1 : 1</text>

  <!-- ==================== FileManager Class ==================== -->
  <g transform="translate(420, 750)" filter="url(#cShadow)">
    <rect width="370" height="190" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <rect width="370" height="35" rx="6" fill="#475569"/>
    <text x="185" y="23" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">FileManager [Persistence Handler]</text>
    <!-- Methods -->
    <text x="15" y="55" font-size="11" fill="#334155">+ saveMenuItems(MenuItem**, int, string)</text>
    <text x="15" y="72" font-size="11" fill="#334155">+ saveCustomers(Customer*, int, string)</text>
    <text x="15" y="89" font-size="11" fill="#334155">+ saveOrders(Order*, int, string)</text>
    <text x="15" y="106" font-size="11" fill="#334155">+ saveBills(Bill*, int, string)</text>
    <text x="15" y="125" font-size="11" font-weight="bold" fill="#475569">+ loadMenuItems(MenuItem**&amp;, int&amp;, file)</text>
    <text x="15" y="142" font-size="11" fill="#334155">+ loadCustomers(Customer*&amp;, int&amp;, file)</text>
    <text x="15" y="159" font-size="11" fill="#334155">+ loadOrders(Order*&amp;, int&amp;, file)</text>
    <text x="15" y="176" font-size="11" fill="#334155">+ loadBills(Bill*&amp;, int&amp;, file)</text>
  </g>

  <!-- ==================== System Class: Restaurant ==================== -->
  <g transform="translate(840, 110)" filter="url(#cShadow)">
    <rect width="390" height="600" rx="6" fill="#ffffff" stroke="#e11d48" stroke-width="2.5"/>
    <rect width="390" height="35" rx="6" fill="#e11d48"/>
    <text x="195" y="23" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">&lt;&lt;System Controller&gt;&gt; Restaurant</text>
    <!-- Attributes -->
    <text x="15" y="55" font-size="11" font-weight="bold" fill="#e11d48">- menuItems : MenuItem** (Dynamic Polymorphic Array)</text>
    <text x="15" y="72" font-size="11" fill="#334155">- customers : Customer* (Dynamic Array)</text>
    <text x="15" y="89" font-size="11" fill="#334155">- orders : Order* (Dynamic Array)</text>
    <text x="15" y="106" font-size="11" fill="#334155">- bills : Bill* (Dynamic Array)</text>
    <text x="15" y="123" font-size="11" fill="#334155">- menuCount, customerCount, orderCount, billCount : int</text>
    <text x="15" y="140" font-size="11" fill="#334155">- fileManager : FileManager</text>
    <text x="15" y="157" font-size="11" fill="#334155">- dataPath : string ("Data/")</text>
    <line x1="0" y1="167" x2="390" y2="167" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- Private Helpers -->
    <text x="15" y="185" font-size="11" fill="#64748b">- resizeMenu(), resizeCustomers(), resizeOrders()</text>
    <text x="15" y="202" font-size="11" fill="#64748b">- findMenuItemIndex(), findCustomerIndex(), ...</text>
    <text x="15" y="219" font-size="11" fill="#64748b">- getNextMenuItemId(), getNextOrderId(), ...</text>
    <line x1="0" y1="229" x2="390" y2="229" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- Public Methods -->
    <text x="15" y="247" font-size="11" fill="#334155">+ Restaurant() / ~Restaurant()</text>
    <text x="15" y="264" font-size="11" font-weight="bold" fill="#e11d48">+ run() : void [Main Menu Controller]</text>
    <text x="15" y="281" font-size="11" fill="#334155">+ addMenuItem() / displayMenuItems()</text>
    <text x="15" y="298" font-size="11" fill="#334155">+ searchMenuItem() / updateMenuItem() / delete()</text>
    <text x="15" y="315" font-size="11" fill="#334155">+ addCustomer() / displayCustomers() / search()</text>
    <text x="15" y="332" font-size="11" fill="#334155">+ updateCustomer() / deleteCustomer()</text>
    <text x="15" y="349" font-size="11" fill="#334155">+ displayOrders() / searchOrder() / updateOrderStatus()</text>
    <text x="15" y="366" font-size="11" fill="#334155">+ displayBills() / searchBill()</text>
    <text x="15" y="383" font-size="11" font-weight="bold" fill="#059669">+ placeOrder() : void [MAIN TRANSACTION]</text>
    <text x="15" y="400" font-size="11" font-weight="bold" fill="#2563eb">+ generateReport() : void [STATISTICS]</text>
    <text x="15" y="417" font-size="11" font-weight="bold" fill="#7c3aed">+ saveData() / loadData() : void [PERSISTENCE]</text>
  </g>

  <!-- Aggregation Diamond Lines from Restaurant -->
  <!-- Restaurant to MenuItem -->
  <path d="M 840 200 L 410 200" stroke="#1e293b" stroke-width="2" marker-start="url(#diamond)"/>
  <text x="440" y="195" font-size="11" fill="#475569">0..* (menuItems)</text>

  <!-- Restaurant to Order -->
  <path d="M 840 280 L 790 280" stroke="#1e293b" stroke-width="2" marker-start="url(#diamond)"/>
  <text x="800" y="275" font-size="11" fill="#475569">0..*</text>

  <!-- Restaurant to Bill -->
  <path d="M 840 540 L 790 540" stroke="#1e293b" stroke-width="2" marker-start="url(#diamond)"/>
  <text x="800" y="535" font-size="11" fill="#475569">0..*</text>

  <!-- Restaurant to FileManager -->
  <path d="M 840 680 L 600 750" stroke="#475569" stroke-width="2" marker-end="url(#assocArrow)"/>
  <text x="730" y="710" font-size="11" fill="#475569">uses (1)</text>
</svg>
