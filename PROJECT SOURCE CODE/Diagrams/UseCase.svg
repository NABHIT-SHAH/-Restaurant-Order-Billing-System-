<?xml version="1.0" encoding="UTF-8"?>
<svg width="1050" height="750" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="actorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="ucGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1050" height="750" fill="url(#bgGrad)" rx="12"/>

  <!-- Title Banner -->
  <rect x="25" y="20" width="1000" height="65" rx="8" fill="#1e293b" filter="url(#shadow)"/>
  <text x="525" y="48" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">USE CASE DIAGRAM — RESTAURANT ORDER &amp; BILLING SYSTEM</text>
  <text x="525" y="70" font-size="13" fill="#94a3b8" text-anchor="middle">Enrollment: IU2541230417 | Project Code: CPP07 | Actors: 2 | Use Cases: 8</text>

  <!-- System Boundary Box -->
  <rect x="230" y="105" width="590" height="615" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,4" filter="url(#shadow)"/>
  <rect x="250" y="115" width="280" height="30" rx="4" fill="#e2e8f0"/>
  <text x="390" y="135" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">System Boundary: Restaurant Application</text>

  <!-- Actor 1: Customer (Left) -->
  <g transform="translate(40, 260)" filter="url(#shadow)">
    <circle cx="70" cy="50" r="24" fill="url(#actorGrad)"/>
    <path d="M 70 74 L 70 140 M 35 95 L 105 95 M 70 140 L 40 200 M 70 140 L 100 200" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
    <rect x="15" y="215" width="110" height="32" rx="6" fill="#1e293b"/>
    <text x="70" y="236" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">🧑 Customer</text>
  </g>

  <!-- Actor 2: Manager / Cashier (Right) -->
  <g transform="translate(865, 260)" filter="url(#shadow)">
    <circle cx="70" cy="50" r="24" fill="url(#actorGrad)"/>
    <path d="M 70 74 L 70 140 M 35 95 L 105 95 M 70 140 L 40 200 M 70 140 L 100 200" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
    <rect x="5" y="215" width="130" height="32" rx="6" fill="#1e293b"/>
    <text x="70" y="236" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">👤 Manager / Cashier</text>
  </g>

  <!-- Association Lines (Customer) -->
  <line x1="160" y1="350" x2="350" y2="185" stroke="#94a3b8" stroke-width="2"/>
  <line x1="160" y1="360" x2="330" y2="255" stroke="#94a3b8" stroke-width="2"/>
  <line x1="160" y1="375" x2="340" y2="330" stroke="#94a3b8" stroke-width="2"/>
  <line x1="160" y1="390" x2="350" y2="405" stroke="#94a3b8" stroke-width="2"/>

  <!-- Association Lines (Manager) -->
  <line x1="880" y1="330" x2="680" y2="185" stroke="#94a3b8" stroke-width="2"/>
  <line x1="880" y1="350" x2="670" y2="255" stroke="#94a3b8" stroke-width="2"/>
  <line x1="880" y1="365" x2="660" y2="330" stroke="#94a3b8" stroke-width="2"/>
  <line x1="880" y1="380" x2="660" y2="405" stroke="#94a3b8" stroke-width="2"/>
  <line x1="880" y1="400" x2="680" y2="480" stroke="#94a3b8" stroke-width="2"/>
  <line x1="880" y1="420" x2="680" y2="555" stroke="#94a3b8" stroke-width="2"/>
  <line x1="880" y1="440" x2="680" y2="630" stroke="#94a3b8" stroke-width="2"/>
  <line x1="880" y1="460" x2="480" y2="680" stroke="#94a3b8" stroke-width="2"/>

  <!-- Use Case 1: Browse Menu -->
  <g transform="translate(350, 160)" filter="url(#shadow)">
    <ellipse cx="160" cy="28" rx="150" ry="26" fill="url(#ucGrad)" stroke="#3b82f6" stroke-width="2"/>
    <text x="160" y="34" font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">1. Browse Menu Catalog</text>
  </g>

  <!-- Use Case 2: Place Order (Main Transaction - Highlighted) -->
  <g transform="translate(340, 230)" filter="url(#shadow)">
    <ellipse cx="170" cy="30" rx="165" ry="28" fill="url(#highlightGrad)" stroke="#d97706" stroke-width="2.5"/>
    <text x="170" y="34" font-size="14" font-weight="bold" fill="#92400e" text-anchor="middle">2. Place Order (Main Transaction)</text>
    <text x="170" y="49" font-size="10" fill="#b45309" text-anchor="middle">[Creates Order &amp; Generates Bill]</text>
  </g>

  <!-- Use Case 3: Process Payment & Billing -->
  <g transform="translate(350, 305)" filter="url(#shadow)">
    <ellipse cx="160" cy="28" rx="150" ry="26" fill="url(#ucGrad)" stroke="#3b82f6" stroke-width="2"/>
    <text x="160" y="34" font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">3. Process Payment &amp; Billing</text>
  </g>

  <!-- Use Case 4: View Bill Receipt -->
  <g transform="translate(360, 380)" filter="url(#shadow)">
    <ellipse cx="150" cy="26" rx="140" ry="25" fill="url(#ucGrad)" stroke="#3b82f6" stroke-width="2"/>
    <text x="150" y="32" font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">4. View Bill Receipt</text>
  </g>

  <!-- Use Case 5: Manage Menu Items (CRUD) -->
  <g transform="translate(350, 455)" filter="url(#shadow)">
    <ellipse cx="160" cy="28" rx="155" ry="26" fill="url(#ucGrad)" stroke="#10b981" stroke-width="2"/>
    <text x="160" y="34" font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">5. Manage Menu Items (CRUD)</text>
  </g>

  <!-- Use Case 6: Manage Customers (CRUD) -->
  <g transform="translate(350, 530)" filter="url(#shadow)">
    <ellipse cx="160" cy="28" rx="155" ry="26" fill="url(#ucGrad)" stroke="#10b981" stroke-width="2"/>
    <text x="160" y="34" font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">6. Manage Customers (CRUD)</text>
  </g>

  <!-- Use Case 7: Generate Statistical Reports -->
  <g transform="translate(345, 605)" filter="url(#shadow)">
    <ellipse cx="165" cy="28" rx="160" ry="26" fill="url(#ucGrad)" stroke="#8b5cf6" stroke-width="2"/>
    <text x="165" y="34" font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">7. Generate Statistical Reports</text>
  </g>

  <!-- Use Case 8: Save & Load Data Persistence -->
  <g transform="translate(340, 675)" filter="url(#shadow)">
    <ellipse cx="170" cy="26" rx="165" ry="25" fill="url(#ucGrad)" stroke="#ec4899" stroke-width="2"/>
    <text x="170" y="32" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">8. Save &amp; Load Data Persistence</text>
  </g>

  <!-- Include Relationships -->
  <path d="M 460 230 L 460 215" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="495" y="222" font-size="11" font-weight="bold" fill="#ef4444">«include»</text>

  <path d="M 510 286 L 510 305" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="545" y="300" font-size="11" font-weight="bold" fill="#ef4444">«include»</text>

  <path d="M 510 360 L 510 380" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="545" y="375" font-size="11" font-weight="bold" fill="#ef4444">«include»</text>
</svg>
