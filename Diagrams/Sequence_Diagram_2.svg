<?xml version="1.0" encoding="UTF-8"?>
<svg width="1150" height="850" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="sq2Shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <marker id="s2Arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="ret2Arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1150" height="850" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <rect x="25" y="15" width="1100" height="55" rx="8" fill="#1e293b" filter="url(#sq2Shadow)"/>
  <text x="575" y="40" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">SEQUENCE DIAGRAM 2 — DATA PERSISTENCE &amp; FILE MANAGEMENT</text>
  <text x="575" y="58" font-size="12" fill="#94a3b8" text-anchor="middle">Automatic Lifecycle: Startup Loading &amp; Shutdown Saving with Polymorphism</text>

  <!-- Lifeline Boxes -->
  <!-- User: x=100 -->
  <rect x="50" y="85" width="100" height="35" rx="6" fill="#3b82f6" filter="url(#sq2Shadow)"/>
  <text x="100" y="107" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">🧑 User</text>
  <line x1="100" y1="120" x2="100" y2="820" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- main(): x=300 -->
  <rect x="240" y="85" width="120" height="35" rx="6" fill="#475569" filter="url(#sq2Shadow)"/>
  <text x="300" y="107" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">:main()</text>
  <line x1="300" y1="120" x2="300" y2="820" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Restaurant: x=550 -->
  <rect x="490" y="85" width="120" height="35" rx="6" fill="#e11d48" filter="url(#sq2Shadow)"/>
  <text x="550" y="107" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">:Restaurant</text>
  <line x1="550" y1="120" x2="550" y2="820" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- FileManager: x=800 -->
  <rect x="740" y="85" width="120" height="35" rx="6" fill="#7c3aed" filter="url(#sq2Shadow)"/>
  <text x="800" y="107" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">:FileManager</text>
  <line x1="800" y1="120" x2="800" y2="820" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Data Files: x=1020 -->
  <rect x="960" y="85" width="120" height="35" rx="6" fill="#0284c7" filter="url(#sq2Shadow)"/>
  <text x="1020" y="107" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">📁 Data Files (.txt)</text>
  <line x1="1020" y1="120" x2="1020" y2="820" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Phase 1: STARTUP LOADING -->
  <rect x="40" y="140" width="1070" height="300" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-dasharray="6,3"/>
  <rect x="45" y="145" width="220" height="24" rx="3" fill="#3b82f6"/>
  <text x="155" y="161" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">PHASE 1: APPLICATION STARTUP</text>

  <line x1="100" y1="185" x2="300" y2="185" stroke="#1e293b" stroke-width="2" marker-end="url(#s2Arrow)"/>
  <text x="200" y="178" font-size="12" fill="#1e293b">1. Launch Application</text>

  <line x1="300" y1="210" x2="550" y2="210" stroke="#1e293b" stroke-width="2" marker-end="url(#s2Arrow)"/>
  <text x="425" y="203" font-size="12" fill="#1e293b">2. Restaurant() ctor &amp; run()</text>

  <line x1="550" y1="235" x2="800" y2="235" stroke="#1e293b" stroke-width="2" marker-end="url(#s2Arrow)"/>
  <text x="675" y="228" font-size="12" font-weight="600" fill="#7c3aed">3. loadMenuItems(menuItems, cap, path)</text>

  <line x1="800" y1="260" x2="1020" y2="260" stroke="#1e293b" stroke-width="2" marker-end="url(#s2Arrow)"/>
  <text x="910" y="253" font-size="12" fill="#0284c7">4. Read menu_items.txt</text>

  <rect x="760" y="275" width="250" height="36" rx="4" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="885" y="290" font-size="10" fill="#5b21b6" text-anchor="middle">Check token: FOOD -&gt; new FoodItem()</text>
  <text x="885" y="303" font-size="10" fill="#5b21b6" text-anchor="middle">BEVERAGE -&gt; new BeverageItem()</text>

  <line x1="1020" y1="325" x2="800" y2="325" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ret2Arrow)"/>
  <text x="910" y="318" font-size="11" fill="#64748b">5. Records deserialized</text>

  <line x1="550" y1="355" x2="800" y2="355" stroke="#1e293b" stroke-width="2" marker-end="url(#s2Arrow)"/>
  <text x="675" y="348" font-size="11" fill="#1e293b">6. loadCustomers(), loadOrders(), loadBills()</text>

  <line x1="800" y1="380" x2="550" y2="380" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ret2Arrow)"/>
  <text x="675" y="373" font-size="11" fill="#64748b">7. Counts returned to Restaurant</text>

  <line x1="550" y1="410" x2="100" y2="410" stroke="#16a34a" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#ret2Arrow)"/>
  <text x="325" y="403" font-size="12" font-weight="bold" fill="#16a34a">8. Display "Data Loaded Successfully" Banner</text>

  <!-- Phase 2: RUNTIME OPERATIONS -->
  <rect x="40" y="460" width="1070" height="90" rx="6" fill="#fdf4ff" stroke="#c084fc" stroke-dasharray="6,3"/>
  <rect x="45" y="465" width="220" height="24" rx="3" fill="#c084fc"/>
  <text x="155" y="481" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">PHASE 2: RUNTIME OPERATIONS</text>
  <text x="575" y="515" font-size="13" font-weight="600" fill="#7e22ce" text-anchor="middle">User performs CRUD operations, Places Orders, Generates Reports in memory</text>

  <!-- Phase 3: SHUTDOWN SAVING -->
  <rect x="40" y="570" width="1070" height="240" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-dasharray="6,3"/>
  <rect x="45" y="575" width="220" height="24" rx="3" fill="#16a34a"/>
  <text x="155" y="591" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">PHASE 3: SHUTDOWN PERSISTENCE</text>

  <line x1="100" y1="615" x2="550" y2="615" stroke="#1e293b" stroke-width="2" marker-end="url(#s2Arrow)"/>
  <text x="325" y="608" font-size="12" fill="#1e293b">9. Select Option 9 (Exit) -&gt; invokes saveData()</text>

  <line x1="550" y1="645" x2="800" y2="645" stroke="#1e293b" stroke-width="2" marker-end="url(#s2Arrow)"/>
  <text x="675" y="638" font-size="12" font-weight="600" fill="#7c3aed">10. saveMenuItems(menuItems, count, path)</text>

  <line x1="800" y1="675" x2="1020" y2="675" stroke="#1e293b" stroke-width="2" marker-end="url(#s2Arrow)"/>
  <text x="910" y="668" font-size="12" fill="#0284c7">11. Polymorphic item-&gt;toFileString()</text>

  <line x1="550" y1="710" x2="800" y2="710" stroke="#1e293b" stroke-width="2" marker-end="url(#s2Arrow)"/>
  <text x="675" y="703" font-size="11" fill="#1e293b">12. saveCustomers(), saveOrders(), saveBills()</text>

  <line x1="800" y1="735" x2="1020" y2="735" stroke="#1e293b" stroke-width="2" marker-end="url(#s2Arrow)"/>
  <text x="910" y="728" font-size="12" fill="#0284c7">13. Overwrite updated text data files</text>

  <line x1="550" y1="775" x2="100" y2="775" stroke="#16a34a" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#ret2Arrow)"/>
  <text x="325" y="768" font-size="12" font-weight="bold" fill="#16a34a">14. "Data Saved. Thank you for using system!" &amp; clean exit</text>
</svg>
